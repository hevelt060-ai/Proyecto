name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        run: |
          set -euo pipefail
          docker run --detach --name erp-mongodb --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec erp-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              ready=true
              break
            fi
          done
          test "$ready" = true
          docker exec erp-mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          primary=false
          for attempt in $(seq 1 30); do
            if docker exec erp-mongodb mongosh --quiet --eval 'db.adminCommand({ replSetGetStatus: 1 }).myState === 1' | grep -q true; then
              primary=true
              break
            fi
          done
          test "$primary" = true
      - name: Run validation
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE: erp_ci_${{ github.run_id }}_validate
        run: npm run validate
      - name: Run security tests
        run: npm run test:security
      - name: Run MongoDB integration tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE: erp_ci_${{ github.run_id }}
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Stop MongoDB replica set
        if: always()
        run: docker rm --force erp-mongodb || true
